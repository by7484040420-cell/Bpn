name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack project.zip (only if it exists)
        run: |
          if [ -f project.zip ]; then
            unzip -q -o project.zip -d _unpacked
            rm -rf app/src
            cp -a _unpacked/. .
            rm -rf _unpacked project.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack project.zip" || echo "Nothing to commit"
            git push
          else
            echo "No project.zip found, building the files already in the repo"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bipin-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
